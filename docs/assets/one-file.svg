<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630" role="img" aria-labelledby="title desc">
<title id="title">Two names. One file.</title><desc id="desc">The original nested audio filename and a correctly named Jellyfin hardlink point to the same filesystem file identity and media data. Three stages show normal scan, hardlink creation and native Jellyfin probing.</desc>
<rect width="1440" height="630" rx="28" fill="#101626"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="65" fill="#25d9e9" font-size="16" font-weight="700" letter-spacing="3">HARDLINKS, EXPLAINED</text>
<text x="60" y="120" fill="#fff" font-size="40" font-weight="700">Two names. One file.</text>
<text x="60" y="161" fill="#a8b4ce" font-size="21">Sidecar Bridge adds a directory entry. The audio bytes are shared.</text>
<rect x="60" y="219" width="702" height="80" rx="15" fill="#241e3d" stroke="#a474ff"/><text x="84" y="249" fill="#c4a2ff" font-size="15" font-weight="700">ORIGINAL PATH</text><text x="84" y="280" fill="#fff" font-size="21" font-family="Consolas,monospace">Rus Sound/NDA Studio/Film.mka</text>
<rect x="60" y="332" width="702" height="80" rx="15" fill="#12343f" stroke="#25d9e9"/><text x="84" y="362" fill="#25d9e9" font-size="15" font-weight="700">JELLYFIN-FRIENDLY HARDLINK</text><text x="84" y="393" fill="#fff" font-size="21" font-family="Consolas,monospace">Film.NDA Studio.rus.mka</text>
<g fill="none" stroke-width="4"><path d="M762 259h99v57h66" stroke="#a474ff"/><path d="M762 372h99v-56" stroke="#25d9e9"/></g>
<rect x="928" y="225" width="450" height="181" rx="23" fill="#192236" stroke="#455572"/><text x="966" y="269" fill="#fff" font-size="24" font-weight="700">ONE FILE IDENTITY</text>
<path d="M975 320v25m25-47v69m25-58v47m25-72v92m25-59v32m25-45v61" fill="none" stroke="#25d9e9" stroke-width="10" stroke-linecap="round"/>
<text x="1142" y="329" fill="#dce5f7" font-size="19">Same media bytes</text><text x="1142" y="358" fill="#a8b4ce" font-size="17">Same filesystem</text>
<g><rect x="60" y="471" width="413" height="98" rx="16" fill="#192236"/><rect x="513" y="471" width="413" height="98" rx="16" fill="#192236"/><rect x="966" y="471" width="413" height="98" rx="16" fill="#192236"/>
<text x="86" y="509" fill="#c4a2ff" font-size="17">01 / NORMAL SCAN</text><text x="86" y="542" fill="#fff" font-size="22">Find and match sidecars</text>
<text x="539" y="509" fill="#25d9e9" font-size="17">02 / BRIDGE</text><text x="539" y="542" fill="#fff" font-size="22">Create verified hardlinks</text>
<text x="992" y="509" fill="#25d9e9" font-size="17">03 / SAME REFRESH</text><text x="992" y="542" fill="#fff" font-size="22">Jellyfin registers streams</text>
</g></g></svg>
