<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">Same folders. Jellyfin can see the tracks.</title><desc id="desc">Before: audio and subtitles are nested in source folders. After: additional correctly named hardlinks sit beside the video and Jellyfin lists the external tracks.</desc>
<defs><linearGradient id="accent" x2="1"><stop stop-color="#a474ff"/><stop offset="1" stop-color="#25d9e9"/></linearGradient></defs>
<rect width="1440" height="740" rx="28" fill="#101626"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="66" fill="#25d9e9" font-size="16" font-weight="700" letter-spacing="3">SIDECAR BRIDGE / JF_AUTOSOUND</text>
<text x="60" y="122" fill="#fff" font-size="38" font-weight="700">Same folders. Jellyfin can see the tracks.</text>
<text x="60" y="160" fill="#a8b4ce" font-size="21">One normal library scan. Original media stays exactly where it is.</text>
<rect x="52" y="202" width="620" height="398" rx="20" fill="#192236" stroke="#2d3a56"/>
<rect x="758" y="202" width="630" height="398" rx="20" fill="#192236" stroke="#2d3a56"/>
<text x="84" y="248" fill="#c4a2ff" font-size="18" font-weight="700">BEFORE / SOURCE FOLDERS</text>
<text x="790" y="248" fill="#25d9e9" font-size="18" font-weight="700">AFTER / NEXT TO THE VIDEO</text>
<g font-family="Consolas,monospace" font-size="19" fill="#dce5f7">
<text x="84" y="294">Film/</text><text x="105" y="331">├─ Film.mkv</text><text x="105" y="368">├─ Rus Sound/</text><text x="105" y="405">│  └─ Example Voice/</text><text x="105" y="442">│     └─ Film.mka</text><text x="105" y="479">└─ Rus Subs/</text><text x="105" y="516">   └─ SubsGroup/</text><text x="105" y="553">      └─ Film.ass</text>
<text x="790" y="294">Film/</text><text x="811" y="331">├─ Film.mkv</text><text x="811" y="368" fill="#25d9e9">├─ Film.Example Voice.rus.mka</text><text x="811" y="405" fill="#25d9e9">├─ Film.SubsGroup.rus.ass</text><text x="811" y="454">├─ Rus Sound/  [originals]</text><text x="811" y="491">└─ Rus Subs/   [originals]</text>
</g><rect x="790" y="526" width="564" height="43" rx="9" fill="#123f47"/><text x="808" y="554" fill="#7ae5e6" font-size="17">+ 2 hardlinks · same files · no duplicate media data</text>
<path d="M692 389h43m-13-13 13 13-13 13" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="52" y="630" width="1336" height="66" rx="16" fill="#22304a"/>
